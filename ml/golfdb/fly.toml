app = 'swing-analyzer-ml'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero when idle so the box only costs money during analysis.
  # First request after idle cold-starts (torch load ~10-30s) — fine for low volume.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # 4GB headroom for torch + ultralytics + frame decoding (2GB OOM'd on large
  # portrait clips before the read-frame downscale; this is belt-and-suspenders).
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
